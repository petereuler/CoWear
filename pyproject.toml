[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cowear"
version = "1.0.0"
description = "Auditable reproduction code for the CoWear multi-device inertial localization benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CoWear Authors"}]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.65",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
cowear = "cowear.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
